name: Docker image

# Publishes the argile-ai fork's image to ghcr.io/argile-ai/roofer for each
# v*-argile* tag (e.g. v1.0.0-argile.1); upstream's version pushed to 3dgi on
# Docker Hub, which this fork has no credentials for.
on:
  push:
    tags:
      - "v*-argile*"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/build-push-docker.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, and push on a tag
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=4
            VERSION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/argile-ai/roofer:${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
